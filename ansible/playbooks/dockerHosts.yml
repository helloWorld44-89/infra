- name: Configure Docker Servers
  hosts: dockerHosts
  become: true

  roles:
    - common
    - docker
    - cockpit
    - backups
    - qemu
    - updates
    - promtail

  tasks:
    - name: Set timezone
      community.general.timezone:
        name: America/Chicago

    - name: Disable default MOTD scripts
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0644'
      loop:
        - /etc/update-motd.d/10-help-text
        - /etc/update-motd.d/50-motd-news

    - name: Configure dynamic MOTD script
      ansible.builtin.copy:
        dest: /etc/update-motd.d/01-custom
        mode: '0755'
        content: |
          #!/bin/bash
          echo "**************This is a production device in the Conder Home. Unauthorized Access is Prohibited!**************"
          echo ""
          echo "  Hostname : $(hostname)"
          echo "  IP       : $(hostname -I | awk '{print $1}')"
          echo "  Uptime   : $(uptime -p)"
          echo "  CPU Load : $(cut -d ' ' -f1 /proc/loadavg)"
          echo "  Memory   : $(free -h | awk '/^Mem/ {print $3 "/" $2}')"
          echo "  Disk     : $(df -h / | awk 'NR==2 {print $3 "/" $2 " (" $5 " used)"}')"
          echo ""
          echo "**************This is a production device in the Conder Home. Unauthorized Access is Prohibited!**************"

    - name: Create node_exporter directory
      file:
        path: "~/monitoring"
        state: directory
        mode: "0755"

    - name: Write docker-compose.yml
      copy:
        dest: "~/monitoring/docker-compose.yml"
        mode: "0644"
        content: |
          version: '3.8'

          services:
            node_exporter:
              image: prom/node-exporter:latest
              container_name: node_exporter
              restart: unless-stopped
              pid: host
              network_mode: host
              volumes:
                - /proc:/host/proc:ro
                - /sys:/host/sys:ro
                - /:/rootfs:ro
              command:
                - '--path.procfs=/host/proc'
                - '--path.sysfs=/host/sys'
                - '--path.rootfs=/rootfs'
                - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
                - '--web.listen-address=:9100' 
            cadvisor:
              image: gcr.io/cadvisor/cadvisor:latest
              container_name: cadvisor
              restart: unless-stopped
              privileged: true
              ports:
                - "9191:8080"
              devices:
                - /dev/kmsg
              volumes:
                - /:/rootfs:ro
                - /var/run:/var/run:ro
                - /sys:/sys:ro
                - /var/lib/docker:/var/lib/docker:ro
                - /dev/disk/:/dev/disk:ro

    - name: Pull node_exporter image
      community.docker.docker_compose_v2_pull:
        project_src: "~/monitoring"

    - name: Start node_exporter
      community.docker.docker_compose_v2:
        project_src: "~/monitoring"
        state: present

    - name: Verify node_exporter is reachable
      uri:
        url: http://localhost:9100/metrics
        status_code: 200
      register: ne_health
      retries: 5
      delay: 3
      until: ne_health.status == 200
#### -------------Add backups and Plex Share for ARR suite
    - name: Install linux-modules-extra for current kernel
      ansible.builtin.package:
        name: linux-modules-extra-{{ ansible_kernel }}
        state: present
      become: yes

    - name: Install required packages for NFS and SMB
      ansible.builtin.package:
        name:
          - nfs-common       
          - cifs-utils
        state: present

    - name: Load CIFS kernel module
      community.general.modprobe:
        name: cifs
        state: present

    - name: Persist CIFS module on boot
      ansible.builtin.lineinfile:
        path: /etc/modules-load.d/cifs.conf
        line: cifs
        create: yes

    - name: Create mount point directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      become: yes
      loop:
        - /mnt/Plex
        - /mnt/phoneMedia

    - name: Mount SMB share - Plex (guest)
      ansible.posix.mount:
        src: //192.168.5.18/Plex
        path: /mnt/Plex
        fstype: cifs
        opts: guest,uid=1000,gid=1000,iocharset=utf8,vers=3.0,_netdev
        state: mounted
      become: yes
    
    - name: Mount SMB share - PhoneMedia
      ansible.posix.mount:
        src: //192.168.5.18/phoneMedia
        path: /mnt/phoneMedia
        fstype: cifs
        opts: guest,uid=1000,gid=1000,iocharset=utf8,vers=3.0,_netdev
        state: mounted
      become: yes