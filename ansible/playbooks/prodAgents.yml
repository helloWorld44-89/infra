- name: Configure prod-agents-01
  hosts: agents
  become: true
  vars:
    node_exporter_version: "1.8.2"
    node_exporter_port: 9100
    node_exporter_user: "node_exporter"
    node_exporter_install_dir: "/usr/local/bin"
    node_exporter_textfile_dir: "/var/lib/node_exporter/textfile_collector"

    trusted_subnet: "192.168.5.0/24"
    monitoring_ip: "192.168.5.48"

  roles:
    - common
    - cockpit
    - qemu
    - updates

  tasks:

    # ── Node Exporter (native — no Docker on this host) ──────────────────────────
    - name: Create node_exporter system user
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        shell: /sbin/nologin
        system: true
        create_home: false
      tags: [monitoring]

    - name: Create textfile collector directory
      ansible.builtin.file:
        path: "{{ node_exporter_textfile_dir }}"
        state: directory
        owner: "{{ node_exporter_user }}"
        group: "{{ node_exporter_user }}"
        mode: "0755"
      tags: [monitoring]

    - name: Download node_exporter archive
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        mode: "0644"
      register: ne_download
      tags: [monitoring]

    - name: Extract node_exporter binary
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        dest: /tmp
        remote_src: true
      when: ne_download.changed
      tags: [monitoring]

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "{{ node_exporter_install_dir }}/node_exporter"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart node_exporter
      tags: [monitoring]

    - name: Deploy node_exporter systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User={{ node_exporter_user }}
          Group={{ node_exporter_user }}
          Type=simple
          ExecStart={{ node_exporter_install_dir }}/node_exporter \
            --web.listen-address=":{{ node_exporter_port }}" \
            --collector.textfile.directory={{ node_exporter_textfile_dir }} \
            --collector.systemd \
            --collector.processes
          Restart=on-failure
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
      notify: Restart node_exporter
      tags: [monitoring]

    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true
      tags: [monitoring]

    - name: Verify node_exporter is reachable
      ansible.builtin.uri:
        url: "http://localhost:{{ node_exporter_port }}/metrics"
        status_code: 200
      register: node_exporter_health
      retries: 5
      delay: 3
      until: node_exporter_health.status == 200
      tags: [monitoring]

    # ── UFW Firewall ──────────────────────────────────────────────────────────────
    - name: Set UFW default incoming policy to deny
      community.general.ufw:
        direction: incoming
        policy: deny
      tags: [firewall]

    - name: Set UFW default outgoing policy to allow
      community.general.ufw:
        direction: outgoing
        policy: allow
      tags: [firewall]

    - name: Allow SSH from anywhere
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
      tags: [firewall]

    - name: Allow Cockpit from trusted subnet only
      community.general.ufw:
        rule: allow
        port: "9090"
        proto: tcp
        src: "{{ trusted_subnet }}"
      tags: [firewall]

    - name: Allow node_exporter from monitoring server only
      community.general.ufw:
        rule: allow
        port: "{{ node_exporter_port }}"
        proto: tcp
        src: "{{ monitoring_ip }}"
      tags: [firewall]

    - name: Enable UFW
      community.general.ufw:
        state: enabled
      tags: [firewall]

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true
