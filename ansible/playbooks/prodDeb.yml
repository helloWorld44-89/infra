---
- name: Deploy monitoring stack
  hosts: monitoring
  become: true

  vars:
    grafana_admin_user: {{ userName }}
    grafana_admin_password: {{ passWord }}  
    monitoring_base: /opt/monitoring

  roles:
    - common
    - docker
    - cockpit

  tasks:
    #  Qemu Guest Agent
    - name: Install qemu guest agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present

    - name: Start and enable qemu guest agent
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
        enabled: true    
    # ── Config directories ────────────────────────────────────────────────────

    - name: Create config directory tree
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ monitoring_base }}"
        - "{{ monitoring_base }}/prometheus"
        - "{{ monitoring_base }}/alertmanager"
        - "{{ monitoring_base }}/grafana/provisioning/datasources"
        - "{{ monitoring_base }}/grafana/provisioning/dashboards"

    # ── Prometheus config ─────────────────────────────────────────────────────

    - name: Write prometheus.yml
      copy:
        dest: "{{ monitoring_base }}/prometheus/prometheus.yml"
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          alerting:
            alertmanagers:
              - static_configs:
                  - targets:
                      - alertmanager:9093

          rule_files:
            - /etc/prometheus/alert-rules.yml

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9190']

            - job_name: 'host'
              static_configs:
                - targets: ['node_exporter:9100']

            
            - job_name: 'prod-ubsrv-1'
              static_configs:
                 - targets: ['192.168.5.40:9100']

            - job_name: 'prod-ubsrv-2'
              static_configs:
                 - targets: ['192.168.5.43:9100']

            - job_name: 'prod-ubsrv-3'
              static_configs:
                 - targets: ['192.168.5.42:9100']

            - job_name: 'ubsrv01'
              static_configs:
                 - targets: ['192.168.5.16:9100']

            - job_name: 'ubsrv02'
              static_configs:
                 - targets: ['192.168.5.13:9100']

            - job_name: 'fedsrv01'
              static_configs:
                 - targets: ['192.168.5.27:9100']

            - job_name: 'trueNas'
              static_configs:
                 - targets: ['192.168.5.18:9100']

            - job_name: 'winsrv02'
              static_configs:
                 - targets: ['192.168.5.26:9100']

            - job_name: 'pve-Balerion'
              static_configs:
                 - targets: ['192.168.5.10:9100']

            - job_name: 'pve-Smaug'
              static_configs:
                 - targets: ['192.168.5.12:9100']

            - job_name: 'pve-toothless'
              static_configs:
                 - targets: ['192.168.5.11:9100']

            - job_name: 'dev-ubsrv'
              static_configs:
                 - targets: ['192.168.5.45:9100']

            - job_name: 'cadvisor'
              static_configs:
                - targets:
                    - 'cadvisor:8080'           # local — the monitoring VM itself
                    - '192.168.5.40:9191'      # Prod Docker Hosts
                    - '192.168.5.42:9191'      
                    - '192.168.5.43:9191' 
                    - '192.168.5.45:9191'     # Dev docker Host
                    - '192.168.5.13:9191'     #Temp Prod Docker Hosts
                    - '192.168.5.16:9191'
              relabel_configs:
                - source_labels: [__address__]
                  regex: '([^:]+):.*'
                  target_label: instance
                  replacement: '$1'

    - name: Write alert-rules.yml
      copy:
        src: templates/alert-rules.yml
        dest: "{{ monitoring_base }}/prometheus/alert-rules.yml"
        mode: "0644" 


    # ── Alertmanager config ───────────────────────────────────────────────────

    - name: Write alertmanager.yml
      copy:
        dest: "{{ monitoring_base }}/alertmanager/alertmanager.yml"
        content: |
          global:
            resolve_timeout: 5m

          route:
            group_by: ['alertname', 'instance']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            receiver: 'default'

          receivers:
            - name: 'default'
              # Add your notification config here e.g. Slack:
              # slack_configs:
              #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
              #     channel: '#alerts'
              #     send_resolved: true

          inhibit_rules:
            - source_match:
                severity: critical
              target_match:
                severity: warning
              equal: [alertname, instance]

    # ── Grafana provisioning ──────────────────────────────────────────────────

    - name: Write Grafana datasource provisioning
      copy:
        dest: "{{ monitoring_base }}/grafana/provisioning/datasources/prometheus.yml"
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
              editable: false

    - name: Write Grafana dashboard provisioning
      copy:
        dest: "{{ monitoring_base }}/grafana/provisioning/dashboards/default.yml"
        content: |
          apiVersion: 1
          providers:
            - name: default
              type: file
              disableDeletion: false
              updateIntervalSeconds: 30
              options:
                path: /var/lib/grafana/dashboards

    # ── Docker Compose file ───────────────────────────────────────────────────

    - name: Write docker-compose.yml
      template:
        src: templates/docker-compose.yml.j2
        dest: "{{ monitoring_base }}/docker-compose.yml"
        mode: "0644"

    # ── Spin it up ────────────────────────────────────────────────────────────

    - name: Pull images
      community.docker.docker_compose_v2_pull:
        project_src: "{{ monitoring_base }}"

    - name: Start monitoring stack
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_base }}"
        state: present

    # ── Verify ────────────────────────────────────────────────────────────────

    - name: Wait for Grafana to be ready
      uri:
        url: http://localhost:3000/api/health
        status_code: 200
      register: grafana_health
      retries: 10
      delay: 5
      until: grafana_health.status == 200

    - name: Print access info
      debug:
        msg:
          - "Grafana      → http://{{ ansible_host }}:3000  ({{ grafana_admin_user }} / {{ grafana_admin_password }})"
          - "Prometheus   → http://{{ ansible_host }}:9090"
          - "Alertmanager → http://{{ ansible_host }}:9093"