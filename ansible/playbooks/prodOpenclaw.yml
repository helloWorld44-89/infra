- name: Configure prod-openclaw-01
  hosts: openclaw
  become: true
  vars:
    openclaw_install_dir: "/opt/openclaw"
    openclaw_config_dir: "/etc/openclaw"
    openclaw_log_dir: "/var/log/openclaw"
    openclaw_user: "openclaw"
    openclaw_group: "openclaw"
    openclaw_port: 8080
    openclaw_trusted_subnet: "192.168.5.0/24"
    openclaw_monitoring_ip: "192.168.5.48"
    backup_folders:
      - /etc
      - /home
      - /etc/openclaw
      - /opt/openclaw/agents
      - /opt/openclaw/data
      - /var/log/openclaw

  roles:
    - common
    - cockpit
    - backups
    - qemu
    - updates

  tasks:

    # ── System Dependencies ──────────────────────────────────────────────────────
    - name: Install Python, build, and firewall dependencies
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - python3-dev
          - build-essential
          - git
          - libssl-dev
          - libffi-dev
          - curl
          - wget
          - ufw
        state: present
        update_cache: true

    # ── User & Group ─────────────────────────────────────────────────────────────
    - name: Create openclaw group
      ansible.builtin.group:
        name: "{{ openclaw_group }}"
        system: true
        state: present

    - name: Create openclaw user
      ansible.builtin.user:
        name: "{{ openclaw_user }}"
        group: "{{ openclaw_group }}"
        system: true
        shell: /bin/false
        home: "{{ openclaw_install_dir }}"
        create_home: false
        state: present

    # ── Data Disk ────────────────────────────────────────────────────────────────
    - name: Format data disk as ext4
      community.general.filesystem:
        fstype: ext4
        dev: /dev/vdb
        state: present

    - name: Create install dir mount point
      ansible.builtin.file:
        path: "{{ openclaw_install_dir }}"
        state: directory
        mode: "0755"

    - name: Mount data disk at openclaw install dir
      ansible.posix.mount:
        path: "{{ openclaw_install_dir }}"
        src: /dev/vdb
        fstype: ext4
        opts: defaults
        state: mounted

    - name: Set ownership of mount point
      ansible.builtin.file:
        path: "{{ openclaw_install_dir }}"
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_group }}"
        mode: "0750"

    # ── Directories ──────────────────────────────────────────────────────────────
    - name: Create openclaw directories on data disk
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_group }}"
        mode: "0750"
      loop:
        - "{{ openclaw_install_dir }}/agents"
        - "{{ openclaw_install_dir }}/data"
        - "{{ openclaw_install_dir }}/memory"
        - "{{ openclaw_config_dir }}"
        - "{{ openclaw_log_dir }}"

    # ── Python Virtual Environment & Install ─────────────────────────────────────
    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv "{{ openclaw_install_dir }}/venv"
        creates: "{{ openclaw_install_dir }}/venv/bin/activate"

    - name: Set venv ownership
      ansible.builtin.file:
        path: "{{ openclaw_install_dir }}/venv"
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_group }}"
        recurse: true

    - name: Upgrade pip in venv
      ansible.builtin.pip:
        name: pip
        virtualenv: "{{ openclaw_install_dir }}/venv"
        state: latest

    - name: Install OpenClaw via pip
      ansible.builtin.pip:
        name: openclaw
        virtualenv: "{{ openclaw_install_dir }}/venv"
        state: latest
      notify: Restart openclaw

    # ── Environment File ─────────────────────────────────────────────────────────
    - name: Create openclaw environment file
      ansible.builtin.copy:
        dest: "{{ openclaw_config_dir }}/openclaw.env"
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_group }}"
        mode: "0640"
        force: false
        content: |
          OPENCLAW_HOST=0.0.0.0
          OPENCLAW_PORT={{ openclaw_port }}
          OPENCLAW_LOG_DIR={{ openclaw_log_dir }}
          OPENCLAW_DATA_DIR={{ openclaw_install_dir }}/data
          OPENCLAW_AGENTS_DIR={{ openclaw_install_dir }}/agents
          OPENCLAW_MEMORY_DIR={{ openclaw_install_dir }}/memory
          # LLM provider API keys — populate before starting the service
          # OPENAI_API_KEY=
          # ANTHROPIC_API_KEY=
          # OLLAMA_BASE_URL=http://192.168.5.X:11434

    # ── Logrotate ─────────────────────────────────────────────────────────────────
    - name: Configure log rotation for openclaw
      ansible.builtin.copy:
        dest: /etc/logrotate.d/openclaw
        mode: "0644"
        content: |
          {{ openclaw_log_dir }}/*.log {
            daily
            rotate 14
            compress
            delaycompress
            missingok
            notifempty
            create 0640 {{ openclaw_user }} {{ openclaw_group }}
            postrotate
              systemctl kill -s HUP openclaw.service 2>/dev/null || true
            endscript
          }

    # ── Systemd Service ───────────────────────────────────────────────────────────
    - name: Create openclaw systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/openclaw.service
        mode: "0644"
        content: |
          [Unit]
          Description=OpenClaw AI Agent Framework
          Requires=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User={{ openclaw_user }}
          Group={{ openclaw_group }}
          WorkingDirectory={{ openclaw_install_dir }}
          EnvironmentFile={{ openclaw_config_dir }}/openclaw.env
          ExecStart={{ openclaw_install_dir }}/venv/bin/openclaw serve
          Restart=on-failure
          RestartSec=5
          TimeoutStopSec=30
          StandardOutput=append:{{ openclaw_log_dir }}/openclaw.log
          StandardError=append:{{ openclaw_log_dir }}/openclaw-error.log
          LimitNOFILE=65536

          [Install]
          WantedBy=multi-user.target
      notify: Restart openclaw

    - name: Enable and start openclaw service
      ansible.builtin.systemd:
        name: openclaw
        enabled: true
        state: started
        daemon_reload: true

    # ── UFW Firewall ──────────────────────────────────────────────────────────────
    - name: Set UFW default incoming policy to deny
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set UFW default outgoing policy to allow
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH from anywhere
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow Cockpit from trusted subnet only
      community.general.ufw:
        rule: allow
        port: "9090"
        proto: tcp
        src: "{{ openclaw_trusted_subnet }}"

    - name: Allow OpenClaw API from trusted subnet only
      community.general.ufw:
        rule: allow
        port: "{{ openclaw_port }}"
        proto: tcp
        src: "{{ openclaw_trusted_subnet }}"

    - name: Allow node_exporter from monitoring server only
      community.general.ufw:
        rule: allow
        port: "9100"
        proto: tcp
        src: "{{ openclaw_monitoring_ip }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    - name: OpenClaw deployment summary
      ansible.builtin.debug:
        msg:
          - "OpenClaw installed to {{ openclaw_install_dir }}/venv (on 100 GB data disk /dev/vdb)"
          - "Config/env file: {{ openclaw_config_dir }}/openclaw.env"
          - "Edit the env file to add your LLM API keys, then: systemctl restart openclaw"
          - "Service listening on port {{ openclaw_port }} ({{ openclaw_trusted_subnet }} only)"
          - "Logs: {{ openclaw_log_dir }}/openclaw.log"

  handlers:
    - name: Restart openclaw
      ansible.builtin.systemd:
        name: openclaw
        state: restarted
        daemon_reload: true
