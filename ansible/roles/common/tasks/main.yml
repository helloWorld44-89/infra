---
- name: Wait for cloud-init to finish first-boot setup
  command: cloud-init status --wait
  register: cloudinit_wait
  changed_when: false
  failed_when: cloudinit_wait.rc not in [0, 2]

- name: Wait for apt/dpkg locks to be released
  shell: |
    while fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock >/dev/null 2>&1; do
      sleep 2
    done
  changed_when: false

- name: Check if needrestart is installed
  stat:
    path: /etc/needrestart/needrestart.conf
  register: needrestart_conf

- name: Set needrestart to non-interactive (auto-restart services, no prompts)
  lineinfile:
    path: /etc/needrestart/needrestart.conf
    regexp: '^#?\s*\$nrconf\{restart\}\s*='
    line: "$nrconf{restart} = 'a';"
    insertafter: EOF
  when: needrestart_conf.stat.exists

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name:
      - curl
      - wget
      - git
      - unzip
      - htop
      - gnupg
    state: present