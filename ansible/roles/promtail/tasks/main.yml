- name: Install unzip
  apt:
    name: unzip
    state: present

- name: Download promtail archive
  get_url:
    url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-amd64.zip"
    dest: "/tmp/promtail-{{ promtail_version }}.zip"
    mode: '0644'
    checksum: "sha256:{{ promtail_checksum }}"

- name: Extract promtail binary
  unarchive:
    src: "/tmp/promtail-{{ promtail_version }}.zip"
    dest: /tmp
    remote_src: true
    creates: /tmp/promtail-linux-amd64

- name: Install promtail binary
  copy:
    src: /tmp/promtail-linux-amd64
    dest: /usr/local/bin/promtail
    mode: '0755'
    remote_src: true
  notify: Restart promtail

- name: Create promtail directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/promtail
    - /var/lib/promtail

- name: Deploy promtail configuration
  copy:
    dest: /etc/promtail/promtail.yaml
    content: |
      server:
        http_listen_port: 9080
      positions:
        filename: /var/lib/promtail/positions.yaml
      clients:
        - url: {{ promtail_loki_url }}
      scrape_configs:
        - job_name: system
          static_configs:
            - targets:
                - localhost
              labels:
                job: varlogs
                __path__: /var/log/**/*.log
    mode: '0644'
  notify: Restart promtail

- name: Create promtail systemd service
  copy:
    dest: /etc/systemd/system/promtail.service
    content: |
      [Unit]
      Description=Promtail Service
      After=network.target

      [Service]
      ExecStart=/usr/local/bin/promtail -config.file=/etc/promtail/promtail.yaml
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    mode: '0644'

- name: Enable and start promtail service
  systemd:
    name: promtail
    enabled: true
    state: started
    daemon_reload: true
